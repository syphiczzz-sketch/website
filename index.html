<!doctype html>
<html lang="et">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Axion Updates Admin</title>
        <link rel="stylesheet" href="./styles.css">
        <script src="./app.js" defer></script>
    </head>
    <body>
        <main>
            <section id="loginView" class="login">
                <form id="loginForm" class="login-panel">
                    <img src="../img/logo.png" alt="Axion Freeroam">
                    <h1>Admin paneel</h1>
                    <label>
                        Kasutajanimi
                        <input id="username" name="username" autocomplete="username" required>
                    </label>
                    <label>
                        Parool
                        <input id="password" name="password" type="password" autocomplete="current-password" required>
                    </label>
                    <p id="loginError" class="error" aria-live="polite"></p>
                    <button type="submit">Logi sisse</button>
                </form>
            </section>

            <section id="adminView" class="admin hidden">
                <aside class="sidebar">
                    <div class="brand">
                        <img src="../img/logo.png" alt="Axion Freeroam">
                        <div>
                            <p>Axion Freeroam</p>
                            <h1>Uuendused</h1>
                        </div>
                    </div>
                    <button id="newUpdate" type="button">Uus uuendus</button>
                    <button id="logout" type="button" class="ghost">Logi välja</button>
                    <div id="updateList" class="update-list"></div>
                </aside>

                <section class="workspace">
                    <header class="workspace-header">
                        <div>
                            <p>Halda changelogi ja mängijate tagasisidet</p>
                            <h2 id="formTitle">Uus uuendus</h2>
                        </div>
                        <div class="header-actions">
                            <button id="deleteUpdate" class="danger hidden" type="button">Kustuta</button>
                            <button id="saveUpdate" type="button">Salvesta</button>
                        </div>
                    </header>

                    <section class="editor-layout">
                        <form id="updateForm" class="editor-form">
                            <label>
                                Pealkiri
                                <input id="title" maxlength="120" required>
                            </label>
                            <div class="two-cols">
                                <label>
                                    Silt
                                    <input id="tag" maxlength="40" placeholder="nt. Patch 1.2">
                                </label>
                                <label>
                                    Avaldamise aeg
                                    <input id="createdAt" type="datetime-local">
                                </label>
                            </div>
                            <label>
                                Lühikokkuvõte
                                <input id="summary" maxlength="240">
                            </label>
                            <label class="check">
                                <input id="active" type="checkbox" checked>
                                Aktiivne ja mängijatele nähtav
                            </label>

                            <div class="toolbar" aria-label="Teksti tööriistad">
                                <button type="button" data-command="bold"><strong>B</strong></button>
                                <button type="button" data-command="italic"><em>I</em></button>
                                <button type="button" data-command="underline"><u>U</u></button>
                                <button type="button" data-command="strikeThrough"><s>S</s></button>
                                <button type="button" data-command="insertUnorderedList">• List</button>
                                <button type="button" data-command="insertOrderedList">1. List</button>
                                <button type="button" id="divider">Punktiirjoon</button>
                            </div>
                            <div id="bodyEditor" class="rich-editor" contenteditable="true" spellcheck="true"></div>
                        </form>

                        <section class="feedback-panel">
                            <div class="panel-head">
                                <div>
                                    <p>Mängijate hinnangud</p>
                                    <h3 id="feedbackTitle">Viimase uuenduse tagasiside</h3>
                                </div>
                                <button id="refreshFeedback" type="button" class="ghost">Värskenda</button>
                            </div>
                            <div id="feedbackSummary" class="feedback-summary"></div>
                            <div id="feedbackList" class="feedback-list"></div>
                        </section>
                    </section>
                </section>
            </section>
        </main>
    </body>
</html>
