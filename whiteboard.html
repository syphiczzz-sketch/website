<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Whiteboard | Corocat</title>
    <link rel="icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body class="whiteboard-body">
    <header class="board-toolbar">
      <a class="brand" href="learn.html">
        <img src="assets/cat.png" alt="" width="32" height="32">
        <span>Whiteboard</span>
      </a>
      <div class="tool-group">
        <button type="button" data-board-color="#1c1814" class="tool active">Ink</button>
        <button type="button" data-board-color="#b6612e" class="tool">Accent</button>
        <button type="button" data-board-color="#477579" class="tool">Teal</button>
        <button type="button" data-board-clear class="tool">Clear</button>
      </div>
      <a class="button button-light" href="learn.html">Back</a>
    </header>
    <main class="board-layout">
      <section class="board-surface">
        <canvas width="1400" height="900" data-whiteboard></canvas>
      </section>
      <aside class="board-panel">
        <h1>Collaborative room</h1>
        <p>This deployable preview supports local drawing in the browser. Realtime collaboration needs the Liveblocks-backed Next.js page.</p>
        <div class="participant-list">
          <span>Karla</span>
          <span>DesignNest</span>
          <span>Coach</span>
        </div>
      </aside>
    </main>
  </body>
</html>
