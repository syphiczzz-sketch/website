<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In — Corocat</title>
  <meta name="description" content="Sign in to your Corocat account and continue learning.">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="auth-page">

  <!-- Left: form -->
  <div class="auth-panel">
    <div class="auth-form-wrap">

      <a class="auth-back" href="index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Homepage
      </a>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Enter your email and password to sign in</p>

      <button class="btn-secondary" type="button" onclick="alert('Firebase auth — please use the live app at your deployment URL.')">
        <svg width="18" height="18" viewBox="0 0 488 512" fill="currentColor"><path d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 126 23.4 172.9 61.9l-76.2 76.2C327.3 113.8 290.5 96 248 96c-88.8 0-160.1 71.9-160.1 160.1s71.3 160.1 160.1 160.1c94.4 0 135.3-65.7 141.2-100.2H248v-85.3h236.1c2.3 12.7 3.9 26.9 3.9 41.4z"/></svg>
        Sign in with Google
      </button>

      <div class="divider">Or continue with</div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" id="email" type="email" placeholder="name@example.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <div class="form-row">
            <label class="form-label" for="password">Password</label>
            <a class="form-link" href="forgot-password.html">Forgot your password?</a>
          </div>
          <input class="form-input" id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn-primary" type="submit" style="margin-top:0.5rem;">Sign In</button>
      </form>

      <p class="auth-footer-note">
        Don't have an account?
        <a class="form-link" href="signup.html">Sign up</a>
      </p>
    </div>
  </div>

  <!-- Right: sidebar -->
  <div class="auth-sidebar">
    <div class="auth-sidebar-cat">
      <img src="assets/cat.png" alt="" width="48" height="48" style="border-radius:10px;opacity:0.85;">
    </div>
    <blockquote class="auth-sidebar-quote">
      "The learning paths are actually realistic. I can do 30 minutes a day and still feel progress."
    </blockquote>
    <p class="auth-sidebar-attr">Amir H. — Student</p>
  </div>

</div>

<script>
function handleLogin(e) {
  e.preventDefault();
  alert('This is a static preview. Please use the live app for authentication.');
}
document.querySelector('[data-year]') && (document.querySelector('[data-year]').textContent = new Date().getFullYear());
</script>
</body>
</html>
