<!doctype html>
<html lang="et">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Axion Updates Admin</title>
        <link rel="stylesheet" href="admin.css">
        <script src="admin.js" defer></script>
    </head>
    <body>
        <main>
            <section id="loginView" class="login">
                <form id="loginForm" class="login-card">
                    <img src="../img/logo.png" alt="Axion Freeroam">
                    <h1>Update Admin</h1>
                    <label>
                        Kasutajanimi
                        <input id="username" autocomplete="username" required>
                    </label>
                    <label>
                        Parool
                        <input id="password" type="password" autocomplete="current-password" required>
                    </label>
                    <p id="loginError" class="message error" aria-live="polite"></p>
                    <button type="submit">Logi sisse</button>
                </form>
            </section>

            <section id="adminView" class="admin hidden">
                <aside class="sidebar">
                    <div class="brand">
                        <img src="../img/logo.png" alt="Axion Freeroam">
                        <div>
                            <span>Axion Freeroam</span>
                            <h1>Serveri update'id</h1>
                        </div>
                    </div>
                    <button id="newUpdate" type="button">Uus update</button>
                    <button id="logout" type="button" class="secondary">Logi välja</button>
                    <div id="updateList" class="update-list"></div>
                </aside>

                <section class="content">
                    <header class="topbar">
                        <div>
                            <span>Halda update'e, mida mängija näeb serverisse tulles</span>
                            <h2 id="editorTitle">Uus update</h2>
                        </div>
                        <div class="actions">
                            <button id="deleteUpdate" type="button" class="danger hidden">Kustuta</button>
                            <button id="saveUpdate" type="button">Salvesta</button>
                        </div>
                    </header>

                    <section class="editor-grid">
                        <form id="updateForm" class="editor">
                            <label>
                                Pealkiri
                                <input id="title" maxlength="120" required>
                            </label>
                            <div class="row">
                                <label>
                                    Silt
                                    <input id="tag" maxlength="40" placeholder="nt Patch 1.2">
                                </label>
                                <label>
                                    Aeg
                                    <input id="createdAt" type="datetime-local">
                                </label>
                            </div>
                            <label>
                                Lühikirjeldus
                                <input id="summary" maxlength="240">
                            </label>
                            <label class="checkbox">
                                <input id="active" type="checkbox" checked>
                                Näita mängijatele
                            </label>

                            <div class="toolbar">
                                <button type="button" data-command="bold"><strong>B</strong></button>
                                <button type="button" data-command="italic"><em>I</em></button>
                                <button type="button" data-command="underline"><u>U</u></button>
                                <button type="button" data-command="insertUnorderedList">• List</button>
                                <button type="button" data-command="insertOrderedList">1. List</button>
                                <button id="divider" type="button">Punktiirjoon</button>
                            </div>
                            <div id="bodyEditor" class="rich-editor" contenteditable="true" spellcheck="true"></div>
                            <p id="status" class="message" aria-live="polite"></p>
                        </form>

                        <section class="feedback">
                            <div class="feedback-head">
                                <div>
                                    <span>Mängijate tagasiside</span>
                                    <h3 id="feedbackTitle">Vali update</h3>
                                </div>
                                <button id="refreshFeedback" type="button" class="secondary">Värskenda</button>
                            </div>
                            <div id="feedbackStats" class="stats"></div>
                            <div id="feedbackList" class="feedback-list"></div>
                        </section>
                    </section>
                </section>
            </section>
        </main>
    </body>
</html>
