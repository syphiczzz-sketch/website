<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up — Corocat</title>
  <meta name="description" content="Create a free Corocat account and start learning with AI.">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="auth-page">

  <!-- Left: bg-muted (hidden on mobile) -->
  <div class="auth-left">
    <div class="auth-left-top">
      <a href="index.html" class="brand">
        <img src="assets/cat.png" alt="" width="40" height="40">
        <span style="font-family:'Cormorant Garamond',Georgia,serif;font-size:1.35rem;font-weight:600;">Corocat</span>
      </a>
    </div>
    <div class="auth-left-middle">
      <h1>Unlock your<br><span id="typing-word">potential</span></h1>
      <p>Join a community of learners and start your journey to mastery with our AI-powered courses.</p>
    </div>
    <div></div>
  </div>

  <!-- Right: form -->
  <div class="auth-right">
    <div class="auth-form-wrap">

      <a class="auth-back" href="index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Homepage
      </a>

      <a href="index.html" class="auth-logo">
        <img src="assets/cat.png" alt="" width="36" height="36" style="border-radius:8px;">
        <span>Corocat</span>
      </a>

      <div class="auth-title">Create an account</div>
      <p class="auth-sub">Enter your email and password to create your account</p>

      <button class="btn-form-outline" type="button" onclick="alert('Firebase authentication requires the live Next.js app.')">
        <svg width="16" height="16" viewBox="0 0 488 512" fill="currentColor"><path d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 126 23.4 172.9 61.9l-76.2 76.2C327.3 113.8 290.5 96 248 96c-88.8 0-160.1 71.9-160.1 160.1s71.3 160.1 160.1 160.1c94.4 0 135.3-65.7 141.2-100.2H248v-85.3h236.1c2.3 12.7 3.9 26.9 3.9 41.4z"/></svg>
        Sign up with Google
      </button>

      <div class="divider">Or continue with</div>

      <form onsubmit="handleSignup(event)" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" id="email" type="email" placeholder="name@example.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" id="password" type="password" placeholder="Min 8 characters" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input class="form-input" id="confirmPassword" type="password" autocomplete="new-password" required>
        </div>
        <button class="btn-form-primary" type="submit">Sign Up</button>
      </form>

      <p class="auth-footer-note">
        Already have an account?&nbsp;
        <a class="form-link" href="login.html">Sign in</a>
      </p>
    </div>
  </div>

</div>
<script>
function handleSignup(e) {
  e.preventDefault();
  if (document.getElementById('password').value !== document.getElementById('confirmPassword').value) {
    alert("Passwords don't match.");
    return;
  }
  alert('This is a static preview. Firebase authentication requires the live app.');
}
const words = ['potential', 'knowledge'];
let wi = 0;
setInterval(() => { wi = (wi + 1) % words.length; document.getElementById('typing-word').textContent = words[wi]; }, 2500);
</script>
</body>
</html>
