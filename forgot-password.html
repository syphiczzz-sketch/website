<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password | Corocat</title>
    <link rel="icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body class="auth-page compact-auth">
    <main class="auth-panel standalone-card">
      <a class="brand auth-brand" href="index.html">
        <img src="assets/cat.png" alt="" width="36" height="36">
        <span>Corocat</span>
      </a>
      <h1>Forgot your password?</h1>
      <p>Enter your email and we will show a confirmation for this static deploy package.</p>
      <form class="form-stack" data-static-form data-success="Password reset demo submitted. In production, Firebase sends the email.">
        <label>
          Email
          <input type="email" name="email" placeholder="name@example.com" required>
        </label>
        <button class="button button-dark full-width" type="submit">Send Reset Link</button>
      </form>
      <p class="auth-note">Remember your password? <a href="login.html">Sign in</a></p>
    </main>
  </body>
</html>
